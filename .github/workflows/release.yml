name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: dist:linux
          - os: windows-latest
            cmd: dist:win
          - os: macos-latest
            cmd: dist:mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKS_PUBLIC_KEY: ${{ secrets.PACKS_PUBLIC_KEY }}
        run: npm run ${{ matrix.cmd }} -w @teka/desktop
