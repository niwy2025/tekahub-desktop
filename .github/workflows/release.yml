name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder_args: --linux AppImage
          - os: windows-latest
            builder_args: --win nsis
          - os: macos-latest
            builder_args: --mac dmg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Build desktop
        run: npm run build -w @teka/desktop
      - name: Package & publish to GitHub Releases
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKS_PUBLIC_KEY: ${{ secrets.PACKS_PUBLIC_KEY }}
          EP_GH_IGNORE_TIME: "true"
        # Must run inside apps/desktop so electron-builder reads this package.json publish config.
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
